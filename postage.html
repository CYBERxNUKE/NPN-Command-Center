<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPN Postage Estimate</title><style>body{font:14px Arial;background:#070b12;color:#f4f7fb;margin:0;padding:24px}main{max-width:760px;margin:auto}.panel{border:1px solid #26344a;background:#101722;border-radius:12px;padding:16px;margin:12px 0}label{display:block;margin:8px 0}input,select,button{padding:8px;margin-top:4px}button{cursor:pointer}.muted{color:#91a3ba}pre{white-space:pre-wrap;background:#070b12;padding:12px;border-radius:8px}a{color:#9bc3ff}</style></head>
<body><main><p><a href="./">Back to dashboard</a></p><h1>Postage estimate</h1><p class="muted">USPS prices are estimates until the live USPS API account is configured.</p><div id="status" class="muted">Loading...</div><section class="panel"><label>Origin ZIP<br><input id="origin" inputmode="numeric" maxlength="5"></label><label>Destination ZIP<br><input id="destination" inputmode="numeric" maxlength="5"></label><label>Weight in ounces<br><input id="weight" type="number" min="1" step="0.1" value="1"></label><label>Mail class<br><select id="mailClass"><option value="USPS_GROUND_ADVANTAGE">USPS Ground Advantage</option><option value="PRIORITY_MAIL">Priority Mail</option></select></label><button id="quote">Get estimate</button></section><pre id="result"></pre></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public-config.js"></script><script src="auth.js" defer></script><script src="postage.js" defer></script>
</body></html>
