<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPN Account</title><style>body{font:14px Arial;background:#070b12;color:#f4f7fb;margin:0;padding:24px}main{max-width:760px;margin:auto}.panel{border:1px solid #26344a;background:#101722;border-radius:12px;padding:16px;margin:12px 0}input,button{padding:8px;margin:4px 0}button{cursor:pointer}.muted{color:#91a3ba}a{color:#9bc3ff}</style></head>
<body><main><p><a href="./">Back to dashboard</a></p><h1>Household profile</h1><div id="status" class="muted">Loading...</div><section class="panel"><label>Display name<br><input id="displayName"></label><br><button id="saveProfile">Save profile</button></section><section class="panel"><h2>Submission limits</h2><p class="muted">Use zero for no submissions. Leave blank for no configured limit.</p><label>Current member limit per opportunity<br><input id="memberLimit" type="number" min="0" step="1"></label><br><label>Household limit per opportunity<br><input id="householdLimit" type="number" min="0" step="1"></label><br><button id="saveLimits">Save limits</button></section><section class="panel"><h2>Alerts</h2><label>Email destination<br><input id="emailDestination" type="email" placeholder="name@example.com"></label><label><input id="emailEnabled" type="checkbox"> Enable email alerts</label><br><label>SMS destination<br><input id="smsDestination" type="tel" placeholder="+15551234567"></label><label><input id="smsEnabled" type="checkbox"> Enable SMS alerts</label><br><button id="saveAlerts">Save alert settings</button><p class="muted">Use Enable push in the account panel after saving to register this device.</p></section><section class="panel"><h2>Members</h2><div id="members"></div><input id="memberLabel" placeholder="Member label"><button id="addMember">Add current user</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public-config.js"></script><script src="auth.js" defer></script><script src="account.js" defer></script>
</body></html>
