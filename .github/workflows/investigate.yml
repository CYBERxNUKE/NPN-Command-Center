name: NPN investigator

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check official sources
        continue-on-error: true
        run: python scripts/watch.py
      - name: Scan all release calendars
        continue-on-error: true
        run: python scripts/topps_release_watch.py
      - name: Collect secondary-source review leads
        continue-on-error: true
        run: python scripts/collect_review_leads.py
      - name: Archive expired NPN records
        run: python scripts/archive_expired.py
      - name: Sync public records to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python scripts/sync_public_data.py
      - name: Commit state changes
        run: |
          git config user.name "npn-investigator"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: daily NPN source check"
          git push
      - name: Create alert issue when sources changed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = JSON.parse(fs.readFileSync('data/discovery-log.json','utf8'));
            const fresh=(log.events||[]).filter(x=>x.type==='SOURCE_CHANGED' && Date.parse(x.time) > Date.now()-20*60*1000);
            if(!fresh.length) return;
            const body=fresh.map(x=>`- **${x.source}** changed: ${x.url}\n  Signals: ${(x.signals||[]).join(', ')}`).join('\n');
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`🚨 NPN source change detected (${fresh.length})`,body:`The investigator found official-source changes that need review.\n\n${body}\n\nDo not assume a changed page means a new eligible offer; verify the official rules before mailing.`});
      - name: Create alert issue when sources fail
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = JSON.parse(fs.readFileSync('data/engine-status.json','utf8'));
            const watchlist = JSON.parse(fs.readFileSync('data/watchlist.json','utf8'));
            const errors=(status.results||[]).filter(x=>x.status==='ERROR');
            const calendarErrors=(watchlist.calendarChecks||[]).filter(x=>x.status==='ERROR');
            if(!errors.length && !calendarErrors.length) return;
            const lines=errors.map(x=>`- ${x.name}: ${x.url} (${x.error})`).concat(calendarErrors.map(x=>`- ${x.name}: ${x.url} (${x.error})`));
            const open=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            if(open.some(issue=>issue.title.startsWith('NPN source checks failed'))) return;
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`NPN source checks failed (${lines.length})`,body:`The investigator could not verify these sources:\n\n${lines.join('\n')}\n\nRetry after the source becomes available.`});
      - name: Fail when source checks have errors
        if: always()
        run: |
          python -c "import json; s=json.load(open('data/engine-status.json')); w=json.load(open('data/watchlist.json')); errors=[x for x in s.get('results',[]) if x.get('status')=='ERROR']+[x for x in w.get('calendarChecks',[]) if x.get('status')=='ERROR']; print(json.dumps({'errors':len(errors)})); raise SystemExit(1 if errors else 0)"
